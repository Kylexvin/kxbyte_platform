<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mech Design Group · Navbar</title>
    <!-- Font Awesome for icons (optional, but used for visual reference) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* main navbar container */
        .navbar {
            width: 100%;
            max-width: 1280px;
            background: #ffffff;
            border-radius: 60px;          /* pill shape for modern look */
            box-shadow: 0 12px 30px rgba(0, 20, 30, 0.12), 0 4px 8px rgba(0, 0, 0, 0.02);
            padding: 0.6rem 1.2rem 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;               /* allow wrapping on small screens */
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 110, 130, 0.08);
        }

        /* left side: logo + group name */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-shrink: 0;
        }

        /* logo (jpg) – far left */
        .logo {
            height: 52px;
            width: 52px;
            border-radius: 50%;            /* round logo looks friendly */
            object-fit: cover;
            background: #eef2f5;            /* fallback if jpg missing */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border: 2px solid #ffffff;
            transition: transform 0.2s;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        /* group name */
        .group-name {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            color: #0b2d3b;
            white-space: nowrap;
            background: linear-gradient(145deg, #0b2d3b, #1b4a5a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        /* right side: all navigation links */
        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem 0.5rem;
            list-style: none;
            margin-left: auto;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e3d4c;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: transparent;
            letter-spacing: 0.2px;
        }

        /* subtle separator for .nav-links (using pseudo-elements instead of pipes, but we add custom pipe via CSS) */
        .nav-links li:not(:last-child)::after {
            content: "|";
            color: #cbdae0;
            font-weight: 300;
            margin: 0 0.1rem 0 0.2rem;
            font-size: 1.2rem;
            line-height: 1;
            display: inline-block;
            vertical-align: middle;
            pointer-events: none;
        }

        /* but we don't want pipe after the last item, and also we want hover effect */
        .nav-links li:last-child::after {
            content: none;
        }

        /* remove pipe on mobile if needed – we'll handle via media query later */

        /* hover styles */
        .nav-links a:hover {
            background: #e5f0f5;
            color: #0c4a5e;
            transform: translateY(-1px);
        }

        /* specific accent for 'contact' maybe */
        .nav-links a i {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* special style for "moi university main campus" – maybe slightly smaller/italic but we keep it clean */
        .nav-links a[data-campus] {
            font-style: italic;
            font-weight: 500;
            background: #eef7fa;
            padding: 0.45rem 0.9rem;
            border-radius: 40px;
        }

        .nav-links a[data-campus]:hover {
            background: #d6e9f0;
        }

        /* responsive */
        @media (max-width: 1050px) {
            .group-name {
                font-size: 1.15rem;
            }
            .nav-links a {
                padding: 0.5rem 0.7rem;
                font-size: 0.88rem;
            }
            .nav-links li:not(:last-child)::after {
                margin: 0 0 0 0.15rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 850px) {
            .navbar {
                border-radius: 30px;
                padding: 0.6rem 1rem;
            }
            .logo {
                height: 44px;
                width: 44px;
            }
            .group-name {
                font-size: 1rem;
                white-space: normal;
            }
            .nav-links {
                gap: 0.2rem;
            }
            .nav-links a {
                padding: 0.4rem 0.6rem;
                font-size: 0.82rem;
            }
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                border-radius: 28px;
                padding: 0.8rem 1rem;
                gap: 0.6rem;
            }
            .nav-left {
                width: 100%;
            }
            .nav-links {
                width: 100%;
                margin-left: 0;
                justify-content: flex-start;
                border-top: 1px solid #e0ecf2;
                padding-top: 0.65rem;
                gap: 0.2rem 0.4rem;
            }
            .nav-links li:not(:last-child)::after {
                content: "";           /* remove pipe on mobile for cleaner wrap */
                margin: 0;
            }
            .nav-links a {
                padding: 0.4rem 0.75rem;
            }
            .nav-links a[data-campus] {
                padding: 0.35rem 0.75rem;
            }
        }

        /* demo note styling */
        .demo-note {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #416a7a;
            background: #ffffffd8;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            backdrop-filter: blur(4px);
        }

        .demo-note i {
            margin-right: 6px;
            color: #157a8f;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar" aria-label="Main navigation">
        <!-- left side: logo + group name -->
        <div class="nav-left">
            <!-- logo jpg at far left (placeholder image — replace with your actual jpg) -->
            <img class="logo" src="/documents/logo.jpeg"
                 alt="Mech Design Group logo">
            <!-- group name -->
            <span class="group-name">MECH DESIGN GROUP</span>
        </div>

        <!-- all navigation links (including pipes via CSS) -->
        <ul class="nav-links">
            <li><a href="#about">ABOUT</a></li>
            <li><a href="#campus" data-campus>moi university main campus</a></li>
            <li><a href="#cad">CAD software</a></li>
            <li><a href="#projects">projects</a></li>
            <li><a href="#activities">activities</a></li>
            <li><a href="#contact">contact</a></li>
        </ul>
    </nav>

    <!-- subtle note for demonstration (optional) -->
    <div class="demo-note">
        <i class="fas fa-chevron-left"></i> logo jpg at far left  •  links exactly as specified
    </div>

    <!-- Note: The logo src is an inline SVG placeholder — replace with your actual JPG file (e.g., "logo.jpg") -->
</body>
</html>
